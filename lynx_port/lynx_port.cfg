# Lynx Linker Configuration for SMB Port
# MAIN starts at $0800 to preserve SMB's RAM variables at $0200-$07FF

SYMBOLS {
    __STACKSIZE__:        type = weak, value = $0000;  # No C stack (pure asm)
    __STARTOFDIRECTORY__: type = weak, value = $00CB;  # start just after loader
    __BANK0BLOCKSIZE__:   type = weak, value = $0400;  # 1KB block size
    __BANK1BLOCKSIZE__:   type = weak, value = $0000;  # No bank 1
    __EXEHDR__:           type = import;               # From exehdr.s
    __BOOTLDR__:          type = import;               # From bootldr.s
    __DEFDIR__:           type = import;               # From defdir.s
}

MEMORY {
    # Zero Page - SMB owns all of ZP ($00-$FF) at runtime.
    # Only EXTZP (cc65 bootloader, dead after boot) may allocate here.
    ZP:     file = "", define = yes, start = $0000, size = $0100;

    # Startup-code overlay: $0800-$08D2 is dead after boot (startup ends with jmp Start).
    # irq_handler at $08D3 must remain live. file="" = virtual BSS only (no file output).
    RECYCLED: file = "", define = yes, start = $0800, size = $00D3;

    # 64-byte Lynx header at start of file
    HEADER: file = %O,               start = $0000, size = $0040;

    # Boot loader (encrypted + secondary loader)
    BOOT:   file = %O,               start = $0200, size = __STARTOFDIRECTORY__;

    # Directory entry (8 bytes)
    DIR:    file = %O,               start = $0000, size = 8;

    # Main code/data area - loaded to RAM at $0800
    # SMB uses $0200-$07FF for game variables (sprite OAM, VRAM buffers, etc.)
    # Code+data+BSS: $0800-$BC1F ($B420 = 46,112 bytes)
    MAIN:   file = %O, define = yes, start = $0800, size = $B420;

    # Double-buffered framebuffers at fixed addresses (BSS, not in output file)
    # FB0: $BC20-$DC1F (8,192 bytes = $1FE0 display + $20 gap)
    # FB1: $DC20-$FBFF (8,160 bytes = $1FE0 display)
    FB0MEM: file = "", define = yes, start = $BC20, size = $2000;
    FB1MEM: file = "", define = yes, start = $DC20, size = $1FE0;

    # ROM space remapped to RAM via MAPCTL B2=1 ($FE00-$FFF7, 504 bytes)
    # Excludes $FFF8 (reserved), $FFF9 (MAPCTL), $FFFA-$FFFF (vectors)
    HIGHRAM: file = "", define = yes, start = $FE00, size = $01F8;
}

SEGMENTS {
    # Zero page segments
    ZEROPAGE:  load = ZP,     type = zp,  optional = yes;  # SMB owns all ZP at runtime
    EXTZP:     load = ZP,     type = zp,  optional = yes;
    APPZP:     load = ZP,     type = zp,  optional = yes;

    # Header and boot segments
    EXEHDR:    load = HEADER, type = ro;
    BOOTLDR:   load = BOOT,   type = ro;
    DIRECTORY: load = DIR,    type = ro;

    # Main code segments
    STARTUP:   load = MAIN,   type = ro,  define = yes;
    LOWCODE:   load = MAIN,   type = ro,  define = yes, optional = yes;
    ONCE:      load = MAIN,   type = ro,  define = yes, optional = yes;
    CODE:      load = MAIN,   type = ro,  define = yes;
    RODATA:    load = MAIN,   type = ro,  define = yes;
    DATA:      load = MAIN,   type = rw,  define = yes;
    BSS:       load = MAIN,   type = bss, define = yes;

    # BSS overlay of dead startup code region. NEVER accessed from lynx_startup.s itself.
    RECYCLEDATA: load = RECYCLED, type = bss, define = yes, optional = yes;

    # Framebuffer regions at fixed addresses (no longer float after BSS).
    # Linker will error if MAIN overflows past $BC1F.
    FRAMEBUF0: load = FB0MEM, type = bss, define = yes;
    FRAMEBUF1: load = FB1MEM, type = bss, define = yes;

    # High RAM segment: 504 bytes at $FE00-$FFF7 (ROM space remapped via MAPCTL B2)
    HIGHDATA:  load = HIGHRAM, type = bss, define = yes, optional = yes;
}

